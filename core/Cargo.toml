[package]
name = "pdfcore"
version = "0.1.0"
edition = "2021"
description = "Folio PDF core: PDFium text/layout extraction + C ABI"
license = "MIT"

[lib]
name = "pdfcore"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pc-cli"
path = "src/bin/pc-cli.rs"

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[profile.release]
opt-level = 3
panic = "unwind"

[profile.dev]
panic = "unwind"

name: Release

# Pushing a tag like v1.1.0 builds the signed app bundle and creates a DRAFT GitHub release
# with the zip and its SHA-256. Publishing stays a manual step after reviewing the notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: macos-15
    env:
      # Secrets are not always readable inside step `if:`; materialize the flag first.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true' 
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/folio-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          test -n "$IDENTITY"
          echo "FOLIO_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "FOLIO_NOTARIZE=1" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY (notarization enabled)"

      - name: Prepare the notary credentials
        if: env.HAS_SIGNING_CERT == 'true' 
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$NOTARY_KEY_P8" ]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "FOLIO_NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
              echo "FOLIO_NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "FOLIO_NOTARY_ISSUER=$NOTARY_ISSUER"
            } >> "$GITHUB_ENV"
            echo "notary credentials: App Store Connect API key"
          elif [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_TEAM_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            {
              echo "FOLIO_NOTARY_APPLE_ID=$NOTARY_APPLE_ID"
              echo "FOLIO_NOTARY_TEAM_ID=$NOTARY_TEAM_ID"
              echo "FOLIO_NOTARY_PASSWORD=$NOTARY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "notary credentials: Apple ID + app-specific password"
          else
            echo "::error::MACOS_CERT_P12 is set but no notary credentials found (NOTARY_APPLE_ID/TEAM_ID/PASSWORD or NOTARY_KEY_P8/KEY_ID/ISSUER)"
            exit 1
          fi

      - name: Resolve the version from the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FOLIO_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FOLIO_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Release $TAG → version $VERSION, build ${GITHUB_RUN_NUMBER}"

      - name: Build the app bundle
        run: ./scripts/build-app.sh

      - name: Verify signature, notarization and bundle version
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Folio.app
          if codesign -dv --verbose=4 dist/Folio.app 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "Developer ID signature detected"
            xcrun stapler validate dist/Folio.app
            spctl --assess --type execute --verbose=2 dist/Folio.app
          else
            echo "ad-hoc signature (not notarized)"
          fi
          ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/Folio.app/Contents/Info.plist)
          echo "bundle version: $ACTUAL (expected $VERSION)"
          [ "$ACTUAL" = "$VERSION" ] || { echo "::error::bundle version mismatch"; exit 1; }
          [ -d dist/Folio.app/Contents/Resources/ru.lproj ] || { echo "::error::ru.lproj missing"; exit 1; }

      - name: Checksum and render the release notes
        run: |
          shasum -a 256 dist/Folio.app.zip > dist/Folio.app.zip.sha256
          SHA=$(awk '{print $1}' dist/Folio.app.zip.sha256)
          CI_RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if codesign -dv --verbose=4 dist/Folio.app 2>&1 | grep -q "Authority=Developer ID Application" \
             && xcrun stapler validate dist/Folio.app >/dev/null 2>&1; then
            SIGNING_NOTE="The bundle is **signed with a Developer ID and notarized by Apple** — it opens with a normal double click, no Gatekeeper bypass is needed."
            SIGNING_LIMITATION=""
          else
            SIGNING_NOTE='The bundle is **ad-hoc signed** (not notarized yet). On first launch use **right-click → Open**, or run `xattr -dr com.apple.quarantine /Applications/Folio.app`.'
            SIGNING_LIMITATION="- ad-hoc signature: Gatekeeper asks for confirmation on other Macs; Developer ID + notarization are on the roadmap;"
          fi
          python3 - "$VERSION" "$SHA" "$GITHUB_SHA" "$CI_RUN" "$SIGNING_NOTE" "$SIGNING_LIMITATION" <<'PY'
          import sys
          version, sha, commit, run, note, limitation = sys.argv[1:7]
          text = open('.github/release-notes.md').read()
          replacements = {
              '{{VERSION}}': version,
              '{{SHA256}}': sha,
              '{{COMMIT}}': commit,
              '{{CI_RUN}}': run,
              '{{SIGNING_NOTE}}': note,
              '{{SIGNING_LIMITATION}}': limitation,
          }
          for key, value in replacements.items():
              text = text.replace(key, value)
          open('dist/release-notes.md', 'w').write(text)
          PY
          echo "sha256: $SHA"
          echo "notes: dist/release-notes.md"

      - name: Delete the temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/folio-signing.keychain-db" 2>/dev/null || true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            STATE=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            gh release upload "$TAG" dist/Folio.app.zip dist/Folio.app.zip.sha256 --clobber
            if [ "$STATE" = "true" ]; then
              gh release edit "$TAG" --draft --notes-file dist/release-notes.md --title "Folio $VERSION"
            else
              echo "release $TAG is already published — assets replaced, notes left untouched"
            fi
          else
            gh release create "$TAG" \
              dist/Folio.app.zip dist/Folio.app.zip.sha256 \
              --draft --verify-tag \
              --title "Folio $VERSION" \
              --notes-file dist/release-notes.md
          fi
          gh release view "$TAG" --json tagName,isDraft,url --jq '"draft=\(.isDraft) tag=\(.tagName) url=\(.url)"'
          gh release view "$TAG" --json assets --jq '.assets[] | "asset: \(.name) — \(.size) bytes"'

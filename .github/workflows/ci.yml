name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}

      - name: Download PDFium
        run: ./scripts/download-pdfium.sh

      - name: Fetch test PDFs
        run: ./scripts/fetch-samples.sh

      - name: Build and test the Rust core
        run: |
          cd core
          cargo build --release
          cargo test --release

      - name: Core acceptance suite
        run: python3 scripts/accept-core.py

      - name: Build the macOS app
        run: |
          cd app
          swift build

      # Signed bundle for download/debugging on every green main build (PRs skip this).
      - name: Build the app bundle
        if: github.event_name != 'pull_request'
        env:
          FOLIO_BUILD: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Checksum the bundle
        if: github.event_name != 'pull_request'
        run: |
          shasum -a 256 dist/Folio.app.zip > dist/Folio.app.zip.sha256
          cat dist/Folio.app.zip.sha256

      - name: Upload the app bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Folio-app-${{ github.run_number }}
          path: |
            dist/Folio.app.zip
            dist/Folio.app.zip.sha256
          retention-days: 14
